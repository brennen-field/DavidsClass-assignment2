<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 925" width="1000" height="925" font-family="JetBrains Mono, Menlo, Consolas, monospace">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
    </marker>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="100%" height="100%" fill="#0b1120" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- ========== ARROWS (drawn first, behind boxes) ========== -->

  <!-- vertical app flow -->
  <line x1="260" y1="128" x2="260" y2="172" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="260" y1="272" x2="260" y2="326" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="260" y1="452" x2="260" y2="506" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="260" y1="584" x2="260" y2="638" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <line x1="260" y1="724" x2="260" y2="778" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead)"/>

  <!-- local -> class services -->
  <line x1="432" y1="250" x2="588" y2="449" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="470" y="330" fill="#fbbf24" font-size="8" transform="rotate(-44 470 330)">convert/parse</text>

  <line x1="432" y1="516" x2="588" y2="177" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="472" y="330" fill="#94a3b8" font-size="8" transform="rotate(58 472 330)">embed · text</text>

  <line x1="432" y1="546" x2="588" y2="245" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="492" y="400" fill="#94a3b8" font-size="8" transform="rotate(58 492 400)">embed · visual</text>

  <line x1="432" y1="682" x2="588" y2="313" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="500" y="490" fill="#94a3b8" font-size="8" transform="rotate(58 500 490)">rerank</text>

  <line x1="432" y1="812" x2="588" y2="109" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrowhead)"/>
  <text x="472" y="480" fill="#94a3b8" font-size="8" transform="rotate(-38 472 480)">LLM</text>

  <!-- ========== BOUNDARIES ========== -->
  <rect x="22" y="40" width="494" height="830" rx="12" fill="rgba(30,41,59,0.06)" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text x="36" y="58" fill="#94a3b8" font-size="11" font-weight="600">runs locally · Python app (Gradio)</text>

  <rect x="560" y="40" width="418" height="494" rx="12" fill="rgba(251,191,36,0.04)" stroke="#fbbf24" stroke-width="1.2" stroke-dasharray="8,4"/>
  <text x="574" y="58" fill="#fbbf24" font-size="11" font-weight="600">dobolyi.com · class services (vLLM)</text>

  <!-- ========== LEFT: IN-APP COMPONENTS ========== -->

  <!-- App UI -->
  <rect x="90" y="74" width="340" height="58" rx="6" fill="rgba(8,51,68,0.40)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="260" y="97" fill="white" font-size="12" font-weight="600" text-anchor="middle">Course Assistant — Gradio UI</text>
  <text x="260" y="114" fill="#94a3b8" font-size="9" text-anchor="middle">Documents · Ask · Quiz</text>

  <!-- Document pipeline -->
  <rect x="90" y="186" width="340" height="92" rx="6" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="260" y="208" fill="white" font-size="11" font-weight="600" text-anchor="middle">Document pipeline (Chase)</text>
  <text x="260" y="226" fill="#94a3b8" font-size="9" text-anchor="middle">upload → LibreOffice / :9005 parse</text>
  <text x="260" y="242" fill="#94a3b8" font-size="9" text-anchor="middle">page text + images → document store</text>
  <text x="260" y="260" fill="#94a3b8" font-size="9" text-anchor="middle">add / delete hooks → every index</text>

  <!-- Indexes -->
  <rect x="90" y="340" width="340" height="122" rx="6" fill="rgba(76,29,149,0.40)" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="260" y="360" fill="white" font-size="11" font-weight="600" text-anchor="middle">Indexes (persisted → DATA_DIR)</text>
  <text x="260" y="380" fill="#94a3b8" font-size="9" text-anchor="middle">• Keyword (BM25)</text>
  <text x="260" y="398" fill="#94a3b8" font-size="9" text-anchor="middle">• Text embedding (Chroma · text_vectors)</text>
  <text x="260" y="416" fill="#94a3b8" font-size="9" text-anchor="middle">• Visual page-image (Chroma · visual_vectors)</text>
  <text x="260" y="438" fill="#a78bfa" font-size="8" text-anchor="middle">text: Nick · visual: Shrihari</text>

  <!-- Retrievers -->
  <rect x="90" y="520" width="340" height="74" rx="6" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="260" y="542" fill="white" font-size="11" font-weight="600" text-anchor="middle">Retrieval (query)</text>
  <text x="260" y="560" fill="#94a3b8" font-size="9" text-anchor="middle">BM25 keyword · text embedding · visual image</text>
  <text x="260" y="578" fill="#94a3b8" font-size="9" text-anchor="middle">top-k candidates per method</text>

  <!-- Combine + Rerank -->
  <rect x="90" y="652" width="340" height="82" rx="6" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="260" y="674" fill="white" font-size="11" font-weight="600" text-anchor="middle">Combine + Rerank (Shrihari)</text>
  <text x="260" y="694" fill="#94a3b8" font-size="9" text-anchor="middle">merge by chunk_id → EvidenceItem</text>
  <text x="260" y="712" fill="#94a3b8" font-size="9" text-anchor="middle">use_reranker on/off → :9004</text>

  <!-- Answers & Quiz -->
  <rect x="90" y="792" width="340" height="70" rx="6" fill="rgba(6,78,59,0.40)" stroke="#34d399" stroke-width="1.5"/>
  <text x="260" y="814" fill="white" font-size="11" font-weight="600" text-anchor="middle">Answer generation</text>
  <text x="260" y="832" fill="#94a3b8" font-size="9" text-anchor="middle">Answers/Ask (Preston) · Quiz (Brennen) → :9000</text>

  <!-- ========== RIGHT: CLASS SERVICES ========== -->

  <!-- LLM -->
  <rect x="592" y="82" width="360" height="54" rx="6" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="690" y="103" fill="white" font-size="11" font-weight="600">LLM · :9000</text>
  <text x="690" y="120" fill="#94a3b8" font-size="8">DeepSeek-V4-Flash-0731</text>

  <!-- Text Embed -->
  <rect x="592" y="150" width="360" height="54" rx="6" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="690" y="171" fill="white" font-size="11" font-weight="600">Text Embedding · :9002</text>
  <text x="690" y="188" fill="#94a3b8" font-size="8">nvidia/Nemotron-3-Embed-1B-BF16</text>

  <!-- Visual Embed -->
  <rect x="592" y="218" width="360" height="54" rx="6" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="690" y="239" fill="white" font-size="11" font-weight="600">Visual Embedding · :9003</text>
  <text x="690" y="256" fill="#94a3b8" font-size="8">Qwen/Qwen3-VL-Embedding-2B</text>

  <!-- Reranker -->
  <rect x="592" y="286" width="360" height="54" rx="6" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="690" y="307" fill="white" font-size="11" font-weight="600">Reranker · :9004</text>
  <text x="690" y="324" fill="#94a3b8" font-size="8">Qwen/Qwen3-VL-Reranker-2B</text>

  <!-- Vision -->
  <rect x="592" y="354" width="360" height="54" rx="6" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="690" y="375" fill="white" font-size="11" font-weight="600">Vision · :9001</text>
  <text x="690" y="392" fill="#94a3b8" font-size="8">Qwen3.6-35B-AWQ-4bit (memes/charts)</text>

  <!-- Parser -->
  <rect x="592" y="422" width="360" height="54" rx="6" fill="rgba(120,53,15,0.30)" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="690" y="443" fill="white" font-size="11" font-weight="600">Document Parser · :9005</text>
  <text x="690" y="460" fill="#94a3b8" font-size="8">dots.mocr</text>

  <!-- ========== LEGEND ========== -->
  <text x="36" y="900" fill="white" font-size="11" font-weight="600">Legend</text>

  <rect x="90" y="890" width="16" height="10" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
  <text x="112" y="898" fill="#94a3b8" font-size="9">UI</text>

  <rect x="150" y="890" width="16" height="10" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
  <text x="172" y="898" fill="#94a3b8" font-size="9">Backend / pipeline</text>

  <rect x="280" y="890" width="16" height="10" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
  <text x="302" y="898" fill="#94a3b8" font-size="9">Index</text>

  <rect x="340" y="890" width="16" height="10" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
  <text x="362" y="898" fill="#94a3b8" font-size="9">Class service</text>

  <rect x="446" y="890" width="16" height="10" rx="2" fill="transparent" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="468" y="898" fill="#94a3b8" font-size="9">runs locally</text>

  <rect x="560" y="890" width="16" height="10" rx="2" fill="transparent" stroke="#fbbf24" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="582" y="898" fill="#94a3b8" font-size="9">runs on dobolyi.com</text>
</svg>
